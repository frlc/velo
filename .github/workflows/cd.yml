# Workflow de Integração Contínua responsável por garantir a qualidade do código
# através da execução de testes unitários a cada push na branch principal.
# Estrutura preparada para expansão futura com novos jobs e etapas de validação.

name: Continuous Deployment

on:
  workflow_dispatch:  
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: fernando-cruzs-projects-d9e96edf
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  TEST_DINO_TOKEN: ${{ secrets.TEST_DINO_TOKEN }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Realiza o checkout do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento nativo do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto respeitando o yarn.lock
      - name: Install Dependencies
        run: yarn install

      # Executa auditoria de segurança nas dependências
      - name: Security Audit
        run: npm audit || true

      # Executa os testes unitários com o Vitest
      - name: Run Unit Tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [ unit-tests ]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # Realiza o checkout do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento nativo do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto respeitando o yarn.lock
      - name: Install Dependencies
        run: yarn install

      # Obter configuração do Vercel (env fica em .vercel/; o Vite no `vite build` lê .env*. na raiz).
      # Secrets opcionais PREVIEW_VITE_* sobrescrevem VITE_* após o pull (evita bundle com VITE vazio).
      - name: Pull Vercel Config
        env:
          OV_URL: ${{ secrets.PREVIEW_VITE_SUPABASE_URL }}
          OV_KEY: ${{ secrets.PREVIEW_VITE_SUPABASE_PUBLISHABLE_KEY }}
          OV_PROJECT_ID: ${{ secrets.PREVIEW_VITE_SUPABASE_PROJECT_ID }}
        run: |
          yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
          cp .vercel/.env.preview.local .env.production.local
          if [ -n "$OV_URL" ] && [ -n "$OV_KEY" ]; then
            grep -vE '^VITE_SUPABASE_(URL|PUBLISHABLE_KEY|PROJECT_ID)=' .env.production.local > .env.production.local.tmp && mv .env.production.local.tmp .env.production.local
            printf 'VITE_SUPABASE_URL=%s\n' "$OV_URL" >> .env.production.local
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$OV_KEY" >> .env.production.local
            if [ -n "$OV_PROJECT_ID" ]; then
              printf 'VITE_SUPABASE_PROJECT_ID=%s\n' "$OV_PROJECT_ID" >> .env.production.local
            fi
          fi

      # Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy preview no vercel
      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [ build-and-deploy ]
    runs-on: ubuntu-latest
    env:
      # Garantir que o Playwright use só E2E_DATABASE_URL (secret preview), não DATABASE_URL herdado.
      DATABASE_URL: ''

    steps:
      # Realiza o checkout do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento nativo do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto respeitando o yarn.lock
      - name: Install Dependencies
        run: yarn install

      # Instalação do Chromium
      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      # Execução dos testes E2E (Postgres apenas projeto preview — secret SUPABASE_PREVIEW_DATABASE_URL)
      - name: Run E2E Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          E2E_DATABASE_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_URL }}

      # Relátorio de testes Automatizados'
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

      # Publicar Report json do Test Dino
      - name: Publish TestDino Report
        if: ${{ !cancelled() }}
        run: npx tdpw upload ./playwright-report --token=${{ env.TEST_DINO_TOKEN }}
          
  promote-to-production:
    name: Promote to Production
    needs: [ build-and-deploy, e2e-tests ]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install

      - name: Pull Vercel Config
        env:
          OV_URL: ${{ secrets.PRODUCTION_VITE_SUPABASE_URL }}
          OV_KEY: ${{ secrets.PRODUCTION_VITE_SUPABASE_PUBLISHABLE_KEY }}
          OV_PROJECT_ID: ${{ secrets.PRODUCTION_VITE_SUPABASE_PROJECT_ID }}
        run: |
          yarn vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
          cp .vercel/.env.production.local .env.production.local
          if [ -n "$OV_URL" ] && [ -n "$OV_KEY" ]; then
            grep -vE '^VITE_SUPABASE_(URL|PUBLISHABLE_KEY|PROJECT_ID)=' .env.production.local > .env.production.local.tmp && mv .env.production.local.tmp .env.production.local
            printf 'VITE_SUPABASE_URL=%s\n' "$OV_URL" >> .env.production.local
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$OV_KEY" >> .env.production.local
            if [ -n "$OV_PROJECT_ID" ]; then
              printf 'VITE_SUPABASE_PROJECT_ID=%s\n' "$OV_PROJECT_ID" >> .env.production.local
            fi
          fi

      - name: Build Vercel Production
        run: yarn vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Production
        run: |
          yarn vercel deploy --prebuilt --prod \
          --token=${{ env.VERCEL_TOKEN }} \
          --scope=${{ env.VERCEL_SCOPE }} \
          --yes