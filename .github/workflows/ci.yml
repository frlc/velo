# Workflow de Integração Contínua responsável por garantir a qualidade do código
# através da execução de testes unitários a cada push na branch principal.
# Estrutura preparada para expansão futura com novos jobs e etapas de validação.

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Realiza o checkout do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js definida na variável global
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento nativo do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto respeitando o yarn.lock
      - name: Install Dependencies
        run: yarn install

      # Executa auditoria de segurança nas dependências
      - name: Security Audit
        run: npm audit || true

      # Executa os testes unitários com o Vitest
      - name: Run Unit Tests
        run: yarn test
